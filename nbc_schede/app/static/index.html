<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d4a7a">
<title>Salone</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --ink:#1f2a3a; --muted:#6b7686; --line:#dde3ec; --soft:#eef2f8;
    --accent:#2d4a7a; --accent-ink:#fff; --pink:#b0306a; --ok:#2e7d4f; --err:#b3261e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* niente "doppio tocco per zoomare": ogni tocco su un pulsante deve valere subito (anche dopo la firma) */
  html, button, .btn, a, input, select, textarea, .toggle { touch-action:manipulation; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px;
               background:var(--accent); color:var(--accent-ink); }
  header.top h1 { font-size:20px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header.top button { background:rgba(255,255,255,.18); color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  button, .btn { font:inherit; border:0; border-radius:10px; padding:10px 16px; min-height:44px; cursor:pointer;
                 background:var(--soft); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  button.primary { background:var(--accent); color:#fff; font-weight:600; }
  button.pink { background:var(--pink); color:#fff; font-weight:600; }
  button.link { background:none; color:var(--accent); padding:6px 8px; min-height:36px; }
  button.danger { background:none; color:var(--err); padding:6px 8px; min-height:36px; }
  button:disabled { opacity:.5; }
  input, select, textarea { font:inherit; font-size:17px; width:100%; padding:10px 12px; border:1px solid var(--line);
                            border-radius:10px; min-height:46px; background:#fff; color:var(--ink); }
  textarea { min-height:70px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  label { display:block; font-size:14px; color:var(--muted); margin:0 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:18px; margin:0 0 12px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  a.row { color:inherit; text-decoration:none; }
  a.row:active { background:var(--soft); }
  .grow { flex:1; min-width:0; }
  .sub { color:var(--muted); font-size:15px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tabs a { flex:1; text-align:center; padding:12px; border-radius:10px; background:var(--card); border:1px solid var(--line);
            color:var(--ink); text-decoration:none; font-weight:600; }
  .tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; min-height:38px; align-items:center; }
  .chip { padding:8px 14px; border:1px solid var(--pink); color:var(--pink); border-radius:20px; background:#fff; cursor:pointer; font-size:16px; }
  .zones { display:flex; flex-wrap:wrap; gap:8px; }
  .zchip { background:#fff; border:1px solid var(--line); border-radius:22px; padding:8px 16px; min-height:44px; }
  .zchip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .search { font-size:20px; min-height:56px; padding-left:16px; }
  .pill { font-size:13px; padding:2px 8px; border-radius:10px; background:var(--soft); color:var(--muted); white-space:nowrap; }
  table.sheet { width:100%; border-collapse:collapse; font-size:16px; }
  table.sheet th { background:var(--accent); color:#fff; font-weight:600; font-size:14px; padding:10px 6px; text-align:left; }
  table.sheet td { padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.sheet tr:nth-child(even) td { background:#f6f8fc; }
  table.sheet tr.click td { cursor:pointer; }
  table.sheet tr.editing td { background:#fff6d6 !important; }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .meta { display:grid; gap:10px 24px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); margin-bottom:12px; }
  .meta b { display:block; font-size:13px; color:var(--muted); font-weight:500; }
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:12px 20px;
           border-radius:10px; color:#fff; display:none; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.2); }
  .print-only, tr.print-only-row { display:none; }
  a.namelink { color:inherit; text-decoration:none; border-radius:10px; }
  a.namelink:active { background:var(--soft); }
  .pencil { color:var(--accent); font-size:18px; }
  .hint { font-size:13px; margin:-6px 0 6px; }
  /* touch-action non vale sulle righe di tabella (tr): va messo anche sulle celle */
  .swipe, tr.swipe td { touch-action:pan-y; -webkit-user-select:none; user-select:none; }
  .sdel { background:var(--err); color:#fff; font-weight:600; min-height:40px; max-width:0; padding:0; overflow:hidden;
          white-space:nowrap; border-radius:8px; transition:max-width .2s ease, padding .2s ease; }
  .swipe.open .sdel { max-width:130px; padding:8px 16px; }
  .swipe.open, table.sheet tr.swipe.open td { background:#fdecea !important; }
  .swipe.open button.link { display:none; }
  table.sheet td.act { white-space:nowrap; text-align:right; }

  /* ---- modulo privacy e consenso ---- */
  .consent-line { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:15px; }
  .consent-line.ok { background:#e8f5ee; }
  .consent-line.missing { background:#fff1e0; }
  .btn.pinkbtn { background:var(--pink); color:#fff; font-weight:600; }
  .warn { background:#fff1e0; border-color:#f3c98b; }
  body.kiosk header.top { display:none; }
  .kiosk-top { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .kiosk-top h1 { flex:1; margin:0; font-size:22px; color:var(--accent); }
  .step { display:inline-flex; width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
          align-items:center; justify-content:center; font-size:16px; margin-right:8px; }
  .toggle { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
            border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; min-height:52px; }
  .toggle .box { width:26px; height:26px; flex:none; border:2px solid var(--muted); border-radius:6px;
                 display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
  .toggle.on { border-color:var(--accent); background:#eef2fb; font-weight:600; }
  .toggle.on .box { background:var(--accent); border-color:var(--accent); }
  .toggle.on .box::after { content:"✓"; }
  .health { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 10px; }
  .legal { font-size:15px; line-height:1.5; max-height:340px; overflow-y:auto; padding:12px 14px;
           border:1px solid var(--line); border-radius:10px; background:#fafbfd; margin-bottom:12px; }
  .legal p { margin:0 0 8px; } .legal ul { margin:0 0 8px; padding-left:20px; } .legal li { margin-bottom:6px; }
  .sigpad { position:relative; border:2px dashed var(--muted); border-radius:12px; background:#fff; height:220px;
            touch-action:none; }
  .sigpad canvas { width:100%; height:100%; display:block; touch-action:none; }
  .sigpad .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                color:var(--muted); pointer-events:none; font-size:18px; }
  .sigline { position:absolute; left:24px; right:24px; bottom:46px; border-bottom:1px solid var(--line); pointer-events:none; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border-radius:0; background:#fff; min-width:64px; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:600; }
  .cu { display:grid; grid-template-columns:170px 1fr; gap:8px 12px; align-items:center; }
  .cu .zones { gap:6px; } .cu .zchip { min-height:38px; padding:6px 14px; }
  .sigimg { max-width:420px; width:100%; border-bottom:1px solid var(--line); }
  @media (max-width:700px) { .cu { grid-template-columns:1fr; } }

  /* ---- Stampa della scheda, come il modulo cartaceo ---- */
  @media print {
    @page { size:A4 landscape; margin:12mm; }
    body { background:#fff; padding:0; font-size:12px; }
    header.top, .no-print, #toast { display:none !important; }
    main { max-width:none; padding:0; }
    .card { border:0; padding:0; margin:0; }
    .print-only { display:block; }
    tr.print-only-row { display:table-row; }
    .print-title { text-align:center; color:var(--accent); font-size:20px; font-weight:700; margin-bottom:10px;
                   padding-bottom:8px; border-bottom:1px solid #333; }
    .print-title span { font-size:15px; font-weight:600; margin-left:8px; }
    .meta { grid-template-columns:repeat(3, 1fr); color:var(--accent); }
    table.sheet { font-size:12px; }
    table.sheet th, table.sheet td { border:1px solid #c9d1de; padding:6px; }
    table.sheet tr.blank td { height:26px; }
    table.sheet th, table.sheet tr:nth-child(even) td { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    table.sheet .act { display:none; }
    #consentsCard, #checkupCard .bar, .consent-line, .warn { display:none !important; }
  }
</style>
</head>
<body data-dashboard="__DASHBOARD__">
<header class="top">
  <button id="dash" hidden aria-label="Torna alla dashboard">⌂ Dashboard</button>
  <button id="back" hidden aria-label="Indietro">‹</button>
  <h1 id="title">Clienti</h1>
  <button id="settingsBtn" aria-label="Impostazioni">⚙︎</button>
</header>
<main id="view"></main>
<div id="toast"></div>
<script src="static/modulo.js"></script>
<script src="static/app.js"></script>
</body>
</html>

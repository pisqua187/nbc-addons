name: "NBC Schede Tecniche"
version: "1.3.0"
slug: "nbc_schede"
description: "Storico smalti e schede di fotoepilazione delle clienti New Body Center"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8077
panel_icon: mdi:clipboard-text
panel_title: "Schede Tecniche"
# Il database sta in /data: entra nei backup di Home Assistant.
# "cold" ferma l'add-on per pochi secondi durante il backup, cosi' il database e' sempre integro.
backup: cold
map:
  - share:rw
options:
  api_key: ""
  dashboard_url: "/nbc-studio/home"
  archivio_consensi: "/share/documenti_importanti/Clienti/Consensi"
schema:
  api_key: password?
  dashboard_url: str
  archivio_consensi: str?
# Porta diretta disattivata: si entra solo da Home Assistant (login richiesto).
# Se un giorno serve l'accesso diretto, attivala dalla scheda "Rete" dell'add-on e imposta api_key.
ports:
  8077/tcp: null
ports_description:
  8077/tcp: "Accesso diretto senza Home Assistant (lasciare vuoto)"
